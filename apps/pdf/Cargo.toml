[package]
name = "nixe-pdf"
version = "0.1.0"
description = "A PDF viewer and editor for Omarchy: annotate, fill forms, sign, reorder pages and edit text"
license = "MIT"
repository = "https://github.com/design-nexus/nixe-pdf"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-pdf"
path = "src/main.rs"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "7cd0be5d09cd1d91510794f58bbc720605951c12" }
serde_json = "1"
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
anyhow = "1.0.104"
async-channel = "2"
cairo-rs = { version = "0.22", features = ["png"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
lopdf = "0.45"
poppler = { version = "0.26", package = "poppler-rs", features = ["v24_12"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
